# Runs one command on the owner's PC, through the self-hosted runner labelled "my-pc".
# Start it with the GitHub tool's run-workflow method on main, then read the job log.
# How agents use it: skills/my-pc/SKILL.md. Set up by skills/my-pc/setup-runner.ps1.
# Safety: this runs anything on the owner's PC as the owner. Keep the trigger to workflow_dispatch
# (only people with write access can start it). Never add pull_request or other triggers.
name: Run on my PC
# Shows the command in the Actions list, so the owner can see what ran.
run-name: "PC: ${{ inputs.command }}"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "The command or script to run"
        required: true
      shell:
        description: "powershell (Windows PowerShell 5.1), cmd or bash (Git Bash)"
        default: powershell
      workdir:
        description: "Folder to run in"
        default: 'C:\AI-Brain-Link'
      timeout:
        description: "Minutes before the job is stopped (up to 4320, three days)"
        default: "60"
      checkout:
        description: "Check out this brain first, so the command can run the repo's scripts from $env:GITHUB_WORKSPACE"
        type: boolean
        default: false
      artifact:
        description: "A file, folder or wildcard on the PC to attach to the run for 3 days (for example stills for an agent to look at). Empty for none."
        default: ""

# No concurrency group on purpose. The PC has one runner, so jobs already run one at a time and
# queue for it in order. A concurrency group keeps only one waiting run and cancels the others
# (learnt on a PC runner, 17 Oct 2026).

permissions:
  contents: read
  issues: write        # the live log: the "PC job live log" issue's text, overwritten every 30 s while a job runs

jobs:
  run:
    runs-on: [self-hosted, my-pc]
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    steps:
      - name: Check out this brain
        if: inputs.checkout
        uses: actions/checkout@v4

      # The owner's copy of the brain on this PC, brought up to date before the command runs. Where the owner
      # has Obsidian, its Git plugin syncs the copy, and this leaves it alone. Without Obsidian nothing else
      # would, and the setup scripts the owner pastes run from that copy. A fast-forward only, signed in as
      # this job, and it never stops the job: a copy with changes of its own in the way stays as it is, and
      # the log says why. safe.directory: the copy belongs to the owner, and a job on the older service runs with admin rights.
      - name: Bring the PC's copy of the brain up to date
        continue-on-error: true
        timeout-minutes: 3
        env:
          PC_REPO_NAME: ${{ github.event.repository.name }}
          PC_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $copy = "C:\AI-Brain-Link\$env:PC_REPO_NAME"
          if ((Test-Path "$copy\.git") -and -not (Test-Path "$copy\.obsidian\plugins\obsidian-git\main.js")) {
            $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PC_TOKEN"))
            Write-Output "::add-mask::$auth"
            $out = & git -c credential.helper= -c safe.directory=* -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -C $copy pull --ff-only --quiet origin main 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -ne 0) { $out; "The copy in $copy wasn't brought up to date." }
          }
          exit 0

      - name: Run
        working-directory: ${{ inputs.workdir }}
        env:
          PC_COMMAND: ${{ inputs.command }}
          PC_SHELL: ${{ inputs.shell }}
          PC_RUN_ID: ${{ github.run_id }}
          # The live log: GitHub gives a job's log only at its end, so its tail goes on an issue as it runs.
          LIVE_TOKEN: ${{ github.token }}
          LIVE_PRIVATE: ${{ github.event.repository.private }}
          # A job that needs a key gets it here, from the repo's Actions secrets, never in the command:
          # SOME_API_KEY: ${{ secrets.SOME_API_KEY }}
        shell: powershell
        run: |
          # The command comes in through an env var, so quotes and $ signs in it reach the shell untouched.
          # Continue, not Stop: in PowerShell 5.1 a program's stderr would otherwise end the step.
          $ErrorActionPreference = 'Continue'
          $log = "C:\AI-Brain-Link\_logs\pc-run-$env:PC_RUN_ID.log"
          $script = Join-Path $env:RUNNER_TEMP "pc-run-$env:PC_RUN_ID"
          switch ($env:PC_SHELL) {
            'powershell' { Set-Content "$script.ps1" $env:PC_COMMAND -Encoding UTF8; $exe = 'powershell'; $argv = @('-NoProfile','-ExecutionPolicy','Bypass','-File',"$script.ps1") }
            'cmd'        { Set-Content "$script.cmd" $env:PC_COMMAND -Encoding ASCII; $exe = 'cmd'; $argv = @('/c',"$script.cmd") }
            'bash'       { [IO.File]::WriteAllText("$script.sh", $env:PC_COMMAND.Replace("`r`n","`n")); $exe = 'bash'; $argv = @("$script.sh") }
            default      { throw "Unknown shell '$env:PC_SHELL': use powershell, cmd or bash." }
          }
          "== $(Get-Date -Format u) | $env:PC_SHELL | $PWD" | Tee-Object $log
          # The command goes in the log too, so the live window on the PC (skills/my-pc/watch-jobs.ps1) shows what's running.
          "-- command:`n$env:PC_COMMAND`n-- output:" | Out-File $log -Append
          # The live log: the log's last 80 lines on the issue "PC job live log" every 30 s (and once at the end),
          # for an agent to follow a long job. Made on the first job; skipped on a public repo; never stops the job.
          $live = {
            param($log, $tok, $repo, $id, $once)
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $h = @{ Authorization = "Bearer $tok"; Accept = 'application/vnd.github+json' }
            $api = "https://api.github.com/repos/$repo/issues"
            try {
              $issue = (Invoke-RestMethod -Uri "${api}?state=all&per_page=100&sort=created&direction=asc" -Headers $h |
                Where-Object { $_.title -eq 'PC job live log' -and -not $_.pull_request } | Select-Object -First 1).number
              if (-not $issue) {
                $new = @{ title = 'PC job live log'; body = 'The last 80 lines of a running PC job, written here every 30 seconds by pc-run.yml so an agent can follow it. Each job overwrites it; leave it open.' }
                $issue = (Invoke-RestMethod -Method Post -Uri $api -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes(($new | ConvertTo-Json)))).number
              }
            } catch { return }
            do {
              if (-not $once) { Start-Sleep 30 }
              try {
                $tail = ((Get-Content $log -Tail 80 -ErrorAction Stop) -join "`n") -replace "\x1b\[[0-9;]*m", ''
                $fence = '`' * 3
                $text = "PC run $id (https://github.com/$repo/actions/runs/$id), as of $(Get-Date -Format u):`n`n$fence`n$tail`n$fence"
                Invoke-RestMethod -Method Patch -Uri "$api/$issue" -Headers $h -ContentType 'application/json; charset=utf-8' `
                  -Body ([Text.Encoding]::UTF8.GetBytes((@{ body = $text } | ConvertTo-Json))) | Out-Null
              } catch {}
            } while (-not $once)
          }
          $liveJob = $null
          if ($env:LIVE_PRIVATE -eq 'true') { $liveJob = Start-Job -ScriptBlock $live -ArgumentList $log, $env:LIVE_TOKEN, $env:GITHUB_REPOSITORY, $env:PC_RUN_ID, $false }
          & $exe @argv 2>&1 | ForEach-Object { "$_" } | Tee-Object $log -Append
          $code = $LASTEXITCODE
          "== exit $code | log kept at $log" | Tee-Object $log -Append
          if ($liveJob) {
            Stop-Job $liveJob -ErrorAction SilentlyContinue; Remove-Job $liveJob -Force -ErrorAction SilentlyContinue
            & $live $log $env:LIVE_TOKEN $env:GITHUB_REPOSITORY $env:PC_RUN_ID $true
          }
          exit $code

      # Lets an agent see a file from the PC (stills, small logs) without pasting it into the log.
      # Kept 3 days only: these can show the owner's home or other people's things.
      - name: Attach a file
        if: inputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: pc-files-${{ github.run_id }}
          path: ${{ inputs.artifact }}
          retention-days: 3
          if-no-files-found: warn

# Which of the brain's computers are on right now, with no key of its own.
# An agent usually runs `python3 skills/brain-spec/devices.py status`, which starts this workflow once per
# runner in knowledge/systems/devices.md (the "ping" job, on that computer: a few seconds, no Actions
# minutes), waits about a minute, cancels any ping still queued (that computer is off or asleep), and
# prints a table. An agent with only a run-workflow tool starts it with the label left empty instead: the
# "check" job does the same on GitHub's machine (a minute or two of the account's free minutes, so on
# demand only, never on a schedule) and puts the table in its log and summary.
# Safety: the ping runs fixed commands that only read; nothing from the inputs reaches a shell.
name: Which devices are on
run-name: "${{ inputs.label != '' && format('Devices: ping {0}', inputs.label) || 'Devices: which are on' }}"

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Leave empty to check every computer in knowledge/systems/devices.md. (The check fills it in to ping one runner.)"
        default: ""
      wait:
        description: "Seconds to wait for each computer to answer (the check only)"
        default: "60"

permissions:
  actions: write   # start and cancel the pings
  contents: read

jobs:
  check:
    if: inputs.label == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            knowledge/systems/devices.md
            skills/brain-spec/devices.py
          sparse-checkout-cone-mode: false
      - name: Ping every computer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAIT: ${{ inputs.wait }}
        run: python3 skills/brain-spec/devices.py status --wait "$WAIT" --ref "$GITHUB_REF_NAME"

  ping:
    if: inputs.label != ''
    runs-on: ${{ inputs.label || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: What this PC has
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Output "DEVICE name: $env:COMPUTERNAME"
          Write-Output "DEVICE os: $($os.Caption) $($os.Version)"
          Write-Output "DEVICE model: $($cs.Manufacturer) $($cs.Model)"
          Write-Output "DEVICE cpu: $(((Get-CimInstance Win32_Processor | Select-Object -First 1).Name).Trim())"
          Write-Output ("DEVICE ram: {0:N0} GB" -f ($cs.TotalPhysicalMemory / 1GB))
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi --query-gpu=name,memory.total,memory.used,utilization.gpu --format=csv,noheader | ForEach-Object { Write-Output "DEVICE gpu: $_ (name, memory, used, busy)" }
          } else {
            Get-CimInstance Win32_VideoController | ForEach-Object { Write-Output "DEVICE gpu: $($_.Name)" }
          }
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object { Write-Output ("DEVICE disk: {0} {1:N0} GB free of {2:N0} GB" -f $_.DeviceID, ($_.FreeSpace / 1GB), ($_.Size / 1GB)) }
          $up = (Get-Date) - $os.LastBootUpTime
          Write-Output ("DEVICE up: {0}d {1}h" -f $up.Days, $up.Hours)
          Write-Output "DEVICE user: $(whoami)"

      - name: What this Mac or Linux computer has
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$(uname)" = Darwin ]; then
            echo "DEVICE name: $(scutil --get ComputerName 2>/dev/null) ($(hostname -s))"
            echo "DEVICE os: macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "DEVICE model: $(sysctl -n hw.model) $(uname -m)"
            echo "DEVICE cpu: $(sysctl -n machdep.cpu.brand_string)"
            echo "DEVICE ram: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
            echo "DEVICE power: $(pmset -g batt | head -1 | sed "s/Now drawing from //; s/'//g")$(pmset -g batt | grep -o '[0-9]*%' | head -1 | sed 's/^/, battery /')"
            df -H / | awk 'NR==2 {print "DEVICE disk: / " $4 " free of " $2}'
          else
            echo "DEVICE name: $(hostname)"
            echo "DEVICE os: $(. /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-Linux}") ($(uname -m))"
            echo "DEVICE cpu: $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "DEVICE ram: $(awk '/MemTotal/ {printf "%d", $2/1048576}' /proc/meminfo) GB"
            if command -v nvidia-smi >/dev/null; then
              nvidia-smi --query-gpu=name,memory.total,memory.used,utilization.gpu --format=csv,noheader | sed 's/^/DEVICE gpu: /; s/$/ (name, memory, used, busy)/'
            fi
            df -h / | awk 'NR==2 {print "DEVICE disk: / " $4 " free of " $2}'
          fi
          echo "DEVICE up: $(uptime | sed 's/.*up *//; s/, *[0-9]* users*.*//')"
          echo "DEVICE user: $(whoami)"

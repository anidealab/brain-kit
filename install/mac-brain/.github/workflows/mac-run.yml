# Runs one command on the owner's Mac, through the self-hosted runner labelled "my-mac".
# Start it with the GitHub tool's run-workflow method on main, then read the job log.
# How agents use it: skills/my-mac/SKILL.md. Set up by skills/my-mac/setup-runner.sh.
# Safety: this runs anything on the owner's Mac as the owner. Keep the trigger to workflow_dispatch
# (only people with write access can start it). Never add pull_request or other triggers.
name: Run on my Mac
# Shows the command in the Actions list, so the owner can see what ran.
run-name: "Mac: ${{ inputs.command }}"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "The command or script to run"
        required: true
      shell:
        description: "bash (macOS's own, version 3.2) or zsh"
        default: bash
      workdir:
        description: "Folder to run in (~ is the owner's home folder)"
        default: "~/AI-Brain-Link"
      timeout:
        description: "Minutes before the job is stopped (up to 4320, three days)"
        default: "60"
      checkout:
        description: "Check out this brain first, so the command can run the repo's scripts from $GITHUB_WORKSPACE"
        type: boolean
        default: false
      artifact:
        description: "A file, folder or wildcard on the Mac to attach to the run for 3 days (for example stills for an agent to look at). Empty for none."
        default: ""

# No concurrency group on purpose. The Mac has one runner, so jobs already run one at a time and
# queue for it in order. A concurrency group keeps only one waiting run and cancels the others.

permissions:
  contents: read
  issues: write        # the live log: the "Mac job live log" issue's text, overwritten every 30 s while a job runs

jobs:
  run:
    runs-on: [self-hosted, my-mac]
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    steps:
      - name: Check out this brain
        if: inputs.checkout
        uses: actions/checkout@v4

      # The owner's copy of the brain on this Mac, brought up to date before the command runs. Where the owner
      # has Obsidian, its Git plugin syncs the copy, and this leaves it alone. Without Obsidian nothing else
      # would, and the setup scripts the owner pastes run from that copy. A fast-forward only, signed in as
      # this job (the owner's own sign-in is in their keychain, which a job can't read), and it never stops
      # the job: a copy with changes of its own in the way stays as it is, and the log says why.
      - name: Bring the Mac's copy of the brain up to date
        continue-on-error: true
        timeout-minutes: 3
        env:
          MAC_REPO_NAME: ${{ github.event.repository.name }}
          MAC_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          copy="$HOME/AI-Brain-Link/$MAC_REPO_NAME"
          if [ -d "$copy/.git" ] && [ ! -f "$copy/.obsidian/plugins/obsidian-git/main.js" ]; then
            auth=$(printf 'x-access-token:%s' "$MAC_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -C "$copy" pull --ff-only --quiet origin main 2>&1 || echo "The copy in $copy wasn't brought up to date."
          fi
          exit 0

      - name: Run
        env:
          MAC_COMMAND: ${{ inputs.command }}
          MAC_SHELL: ${{ inputs.shell }}
          MAC_WORKDIR: ${{ inputs.workdir }}
          MAC_RUN_ID: ${{ github.run_id }}
          # The live log: GitHub gives a job's log only at its end, so its tail goes on an issue as it runs.
          LIVE_TOKEN: ${{ github.token }}
          LIVE_PRIVATE: ${{ github.event.repository.private }}
          # A job that needs a key gets it here, from the repo's Actions secrets, never in the command:
          # SOME_API_KEY: ${{ secrets.SOME_API_KEY }}
          # The backup's read-only token for the owner's private repos, if they added one (skills/backup/SKILL.md).
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        shell: bash
        run: |
          # The command comes in through an env var, so quotes and $ signs in it reach the shell untouched.
          set +e
          case "$MAC_SHELL" in bash|zsh) ;; *) echo "Unknown shell '$MAC_SHELL': use bash or zsh."; exit 1 ;; esac
          log="$HOME/AI-Brain-Link/_logs/mac-run-$MAC_RUN_ID.log"
          mkdir -p "$(dirname "$log")"
          script="$RUNNER_TEMP/mac-run-$MAC_RUN_ID.sh"
          printf '%s\n' "$MAC_COMMAND" > "$script"
          dir="${MAC_WORKDIR/#\~/$HOME}"
          mkdir -p "$dir" && cd "$dir" || exit 1
          # The command goes in the log too, so the live jobs window on the Mac (skills/my-mac/watch-jobs.sh) shows what's running.
          { echo "== $(date -u '+%Y-%m-%d %H:%M:%SZ') | $MAC_SHELL | $PWD"; printf -- '-- command:\n%s\n-- output:\n' "$MAC_COMMAND"; } | tee "$log"
          # The live log: the log's last 80 lines on the issue "Mac job live log" every 30 s (and once at the end),
          # for an agent to follow a long job. Made on the first job; skipped on a public repo; never stops the job.
          live="$RUNNER_TEMP/mac-run-live-$MAC_RUN_ID.py"
          cat > "$live" <<'PY'
          import json, os, re, sys, time, urllib.request
          log, once = sys.argv[1], sys.argv[2] == "once"
          repo, tok, rid, title = os.environ["GITHUB_REPOSITORY"], os.environ["LIVE_TOKEN"], os.environ["MAC_RUN_ID"], "Mac job live log"
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.github.com/repos/%s/%s" % (repo, path), method=method,
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "User-Agent": "brain-live-log"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or b"null")
          try:
              issue = next((i["number"] for i in call("GET", "issues?state=all&per_page=100&sort=created&direction=asc")
                            if i.get("title") == title and "pull_request" not in i), None)
              if issue is None:
                  issue = call("POST", "issues", {"title": title, "body": "The last 80 lines of a running Mac job, written here every 30 seconds by mac-run.yml so an agent can follow it. Each job overwrites it; leave it open."})["number"]
          except Exception:
              sys.exit(0)
          while True:
              if not once:
                  time.sleep(30)
              try:
                  with open(log, encoding="utf-8", errors="replace") as f:
                      tail = re.sub(r"\x1b\[[0-9;]*m", "", "".join(f.readlines()[-80:])).rstrip("\n")
                  fence = "`" * 3
                  when = time.strftime("%Y-%m-%d %H:%M:%SZ", time.gmtime())
                  call("PATCH", "issues/%d" % issue, {"body": "Mac run %s (https://github.com/%s/actions/runs/%s), as of %s:\n\n%s\n%s\n%s" % (rid, repo, rid, when, fence, tail, fence)})
              except Exception:
                  pass
              if once:
                  break
          PY
          livepid=""
          if [ "$LIVE_PRIVATE" = true ] && xcode-select -p >/dev/null 2>&1; then
            python3 "$live" "$log" loop >/dev/null 2>&1 &
            livepid=$!
          fi
          "$MAC_SHELL" "$script" 2>&1 | tee -a "$log"
          code=${PIPESTATUS[0]}
          echo "== exit $code | log kept at $log" | tee -a "$log"
          if [ -n "$livepid" ]; then kill "$livepid" 2>/dev/null; python3 "$live" "$log" once >/dev/null 2>&1; fi
          exit $code

      # Lets an agent see a file from the Mac (stills, small logs) without pasting it into the log.
      # Kept 3 days only: these can show the owner's home or other people's things.
      - name: Attach a file
        if: inputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-files-${{ github.run_id }}
          path: ${{ inputs.artifact }}
          retention-days: 3
          if-no-files-found: warn
